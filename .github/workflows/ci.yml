# Runs on every push / pull request: Python tests, Node tests, frontend build, Docker builds.
name: CI

on:
  push:
  pull_request:

jobs:
  fastapi-ai:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend/fastapi-ai } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/fastapi-ai/requirements.txt }
      - run: pip install -r requirements.txt
      - run: pytest -q

  express-api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend/express-api } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/express-api/package-lock.json }
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  dashboard:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    env: { CI: "true", NEXT_TELEMETRY_DISABLED: "1" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: dashboard/playwright-report, retention-days: 7 }

  docker:
    name: docker (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [fastapi-ai, express-api, frontend, dashboard]
    strategy:
      fail-fast: false # build every image, so one failure doesn't hide another
      matrix:
        service: [fastapi-ai, express-api, streamlit-admin, frontend, dashboard]
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - name: docker compose build ${{ matrix.service }}
        run: |
          set -o pipefail
          docker compose build --progress plain ${{ matrix.service }} 2>&1 | tee build.log
      # Job logs need a GitHub login; annotations are shown on the run page to anyone who can see it.
      - name: Report the build error
        if: failure()
        run: |
          msg=$(grep -iE "error|failed|ERR!|not found" build.log | tail -n 25 | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=docker build ${{ matrix.service }}::${msg:-no error lines found, see the job log}"
