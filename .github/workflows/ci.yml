# Runs on every push / pull request: Python tests, Node tests, frontend build, Docker builds.
name: CI

on:
  push:
  pull_request:

jobs:
  fastapi-ai:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend/fastapi-ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/fastapi-ai/requirements.txt }
      - run: pip install -r requirements.txt
      - run: pytest -q

  express-api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend/express-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/express-api/package-lock.json }
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  dashboard:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    env: { CI: "true", NEXT_TELEMETRY_DISABLED: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: dashboard/playwright-report, retention-days: 7 }

  docker:
    runs-on: ubuntu-latest
    needs: [fastapi-ai, express-api, frontend, dashboard]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
