# Netlify detects Next.js and adds its Next.js runtime automatically (route handlers,
# rewrites and Cache Components all run on Netlify Functions).
# In the Netlify UI set Base directory = dashboard, and BACKEND_URL under Environment variables.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
