<script type="text/plain" data-code="javascript">
// JavaScript for the BACKEND: async patterns, errors, modules, and the event loop.

// ── ES modules (package.json: "type": "module")
import { readFile } from "node:fs/promises";
export const sum = (...n) => n.reduce((a, b) => a + b, 0);

// ── Objects & arrays: immutable updates, destructuring
const user = { id: "u1", name: "Aamir", roles: ["user"] };
const admin = { ...user, roles: [...user.roles, "admin"] };
const { id, ...publicFields } = user;

// ── Callbacks → Promises → async/await
function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

async function loadConfig(path) {
  try {
    const text = await readFile(path, "utf8");
    return JSON.parse(text);
  } catch (err) {
    if (err.code === "ENOENT") return {};          // file missing → defaults
    throw err;                                     // anything else: let it bubble up
  }
}

// ── Concurrency patterns
const ids = ["a", "b", "c"];
const fetchUser = async id => ({ id });

await Promise.all(ids.map(fetchUser));             // parallel; fails fast on first error
await Promise.allSettled(ids.map(fetchUser));      // parallel; collect successes AND failures
await Promise.race([fetchUser("a"), sleep(2000).then(() => { throw new Error("timeout"); })]);
await Promise.any([fetchUser("mirror1"), fetchUser("mirror2")]);   // first success wins

for (const id of ids) await fetchUser(id);         // sequential, when order matters

// Limit concurrency (don't fire 10,000 requests at once)
async function mapLimit(items, limit, fn) {
  const results = new Array(items.length);
  let next = 0;
  // `limit` workers each pull the next index until none are left
  const worker = async () => {
    while (next < items.length) {
      const i = next++;
      results[i] = await fn(items[i]);
    }
  };
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return results;
}

// ── Custom errors with classes
class AppError extends Error {
  constructor(message, status = 500, code = "INTERNAL") {
    super(message);
    this.name = this.constructor.name;
    this.status = status;
    this.code = code;
  }
}
class NotFoundError extends AppError {
  constructor(what) { super(`${what} not found`, 404, "NOT_FOUND"); }
}

// ── Closures for private state
function createRateCounter(limit) {
  const hits = new Map();
  return key => {
    const n = (hits.get(key) ?? 0) + 1;
    hits.set(key, n);
    return n <= limit;
  };
}

// ── Event loop order: sync → process.nextTick → promises (microtasks) → timers → I/O → setImmediate
console.log("1 sync");
setTimeout(() => console.log("5 timeout"));
setImmediate(() => console.log("6 immediate"));
Promise.resolve().then(() => console.log("4 promise"));
process.nextTick(() => console.log("3 nextTick"));
console.log("2 sync");

// ── NEVER block the event loop: one slow sync loop stalls EVERY request
// Bad:  const hash = crypto.pbkdf2Sync(pw, salt, 600000, 64, "sha512");
// Good: const hash = await promisify(crypto.pbkdf2)(pw, salt, 600000, 64, "sha512");
</script>

<script type="text/plain" data-code="typescript">
// TypeScript on the server: types for requests, DB rows, services and errors.
// npm i -D typescript tsx @types/node @types/express   ·   npx tsc --init
// Run without a build step in dev:  npx tsx watch src/index.ts

// ── Domain types
export type Role = "user" | "admin";

export interface User {
  id: string;
  email: string;
  name: string;
  role: Role;
  passwordHash: string;
  createdAt: Date;
}

// Never send passwordHash to clients: derive a safe type
export type PublicUser = Omit<User, "passwordHash">;
export const toPublic = ({ passwordHash, ...rest }: User): PublicUser => rest;

// ── Validate request bodies at runtime with Zod, infer the TS type
import { z } from "zod";

export const RegisterBody = z.object({
  email: z.string().email().toLowerCase(),
  name: z.string().min(2).max(60),
  password: z.string().min(12),
});
export type RegisterBody = z.infer<typeof RegisterBody>;

// ── Generic repository interface: swap Mongo / Postgres / in-memory
export interface Repository<T extends { id: string }> {
  findById(id: string): Promise<T | null>;
  create(data: Omit<T, "id">): Promise<T>;
  update(id: string, patch: Partial<T>): Promise<T>;
  delete(id: string): Promise<void>;
}

export class InMemoryRepo<T extends { id: string }> implements Repository<T> {
  private rows = new Map<string, T>();
  async findById(id: string) { return this.rows.get(id) ?? null; }
  async create(data: Omit<T, "id">) {
    const row = { ...data, id: crypto.randomUUID() } as T;
    this.rows.set(row.id, row);
    return row;
  }
  async update(id: string, patch: Partial<T>) {
    const row = this.rows.get(id);
    if (!row) throw new Error("not found");
    const next = { ...row, ...patch };
    this.rows.set(id, next);
    return next;
  }
  async delete(id: string) { this.rows.delete(id); }
}

// ── Result type: make failure explicit instead of throwing everywhere
type Result<T, E = string> = { ok: true; value: T } | { ok: false; error: E };

function parseAge(input: unknown): Result<number> {
  const n = Number(input);
  return Number.isInteger(n) && n > 0 ? { ok: true, value: n } : { ok: false, error: "invalid age" };
}

// ── Typed Express handler
import type { Request, Response, NextFunction } from "express";

export async function register(req: Request<{}, PublicUser, RegisterBody>, res: Response<PublicUser>, next: NextFunction) {
  const body = RegisterBody.parse(req.body);           // throws ZodError → error middleware → 400
  // ...create user
  res.status(201).json({ id: "u1", email: body.email, name: body.name, role: "user", createdAt: new Date() });
}

// ── Extend Express's Request type (src/types/express.d.ts)
declare global {
  namespace Express {
    interface Request { user?: { id: string; role: Role } }
  }
}

// tsconfig essentials: "strict": true, "module": "NodeNext", "target": "ES2023", "outDir": "dist"

<script type="text/plain" data-code="nodejs">
// Node.js core: the runtime APIs underneath Express and every backend framework.
import http from "node:http";
import { readFile, writeFile, mkdir } from "node:fs/promises";
import { createReadStream, createWriteStream } from "node:fs";
import { pipeline } from "node:stream/promises";
import { createGzip } from "node:zlib";
import path from "node:path";
import { EventEmitter } from "node:events";
import { randomUUID, createHash } from "node:crypto";
import { Worker, isMainThread, parentPort } from "node:worker_threads";

// ── process: env, args, exit, signals
const PORT = Number(process.env.PORT ?? 4000);
console.log(process.argv.slice(2), process.pid, process.memoryUsage().heapUsed);
// Load .env without a library:  node --env-file=.env src/index.js

// ── Paths (ESM has no __dirname)
const __dirname = path.dirname(new URL(import.meta.url).pathname);
const dataDir = path.join(__dirname, "..", "data");

// ── Files
await mkdir(dataDir, { recursive: true });
await writeFile(path.join(dataDir, "hello.txt"), "hi", "utf8");

// ── Streams: process huge files with constant memory
await pipeline(
  createReadStream("access.log"),
  createGzip(),
  createWriteStream("access.log.gz")
);

// ── EventEmitter: the pattern behind servers, sockets and streams
class Jobs extends EventEmitter {}
const jobs = new Jobs();
jobs.on("done", job => console.log("finished", job.id));
jobs.emit("done", { id: randomUUID() });

// ── A raw HTTP server (what Express wraps)
const server = http.createServer(async (req, res) => {
  if (req.method === "GET" && req.url === "/health") {
    res.writeHead(200, { "Content-Type": "application/json" });
    return res.end(JSON.stringify({ ok: true }));
  }
  if (req.method === "POST" && req.url === "/echo") {
    let body = "";
    for await (const chunk of req) body += chunk;      // request is a readable stream
    res.writeHead(200, { "Content-Type": "application/json" });
    return res.end(body);
  }
  res.writeHead(404).end();
});
server.listen(PORT, () => console.log(`listening on :${PORT}`));

// ── Graceful shutdown: finish in-flight requests, close DB, then exit
for (const sig of ["SIGINT", "SIGTERM"]) {
  process.on(sig, () => {
    console.log(`${sig} received, shutting down`);
    server.close(() => process.exit(0));
    setTimeout(() => process.exit(1), 10_000).unref();
  });
}
process.on("unhandledRejection", err => { console.error(err); process.exit(1); });

// ── CPU-heavy work → worker thread (keeps the event loop free)
if (!isMainThread) {
  parentPort.on("message", text => parentPort.postMessage(createHash("sha256").update(text).digest("hex")));
}
// const w = new Worker(new URL(import.meta.url)); w.postMessage("big text"); w.on("message", console.log);

// ── Built-in tools (no extra packages)
//   node --watch src/index.js        auto-restart on change
//   node --test                      test runner
//   node --inspect src/index.js      Chrome DevTools debugger
//   fetch(), WebSocket, AbortController, structuredClone — all global

<script type="text/plain" data-code="expressjs">
// Express 5: routing + middleware. Async errors are forwarded to the error handler automatically.
import express from "express";
import helmet from "helmet";
import cors from "cors";
import morgan from "morgan";
import cookieParser from "cookie-parser";
import rateLimit from "express-rate-limit";

class HttpError extends Error {
  constructor(status, message) { super(message); this.status = status; }
}

export function createApp({ taskRepo }) {          // dependencies injected → easy to test
  const app = express();

  // ── 1. Global middleware: runs for every request, in order
  app.use(helmet());                                         // security headers
  app.use(cors({ origin: ["http://localhost:3000"], credentials: true }));
  app.use(express.json({ limit: "1mb" }));                   // parse JSON bodies
  app.use(cookieParser());
  app.use(morgan("dev"));                                    // request logging
  app.use("/api/", rateLimit({ windowMs: 60_000, limit: 100 }));

  // ── 2. Custom middleware: (req, res, next)
  app.use((req, res, next) => {
    req.id = req.get("x-request-id") ?? crypto.randomUUID();
    res.set("X-Request-Id", req.id);
    next();
  });

  const requireUser = (req, _res, next) => {
    const uid = req.get("x-user-id");
    if (!uid) throw new HttpError(401, "Sign in required");
    req.user = { id: uid };
    next();
  };

  // ── 3. Routers: group related routes
  const tasks = express.Router();
  tasks.use(requireUser);                                    // router-level middleware

  tasks.get("/", async (req, res) => {
    const { done, limit = "20" } = req.query;                // query string
    res.json(await taskRepo.list(req.user.id, { done: done === "true", limit: Number(limit) }));
  });

  tasks.get("/:id", async (req, res) => {                    // route params
    const task = await taskRepo.get(req.user.id, req.params.id);
    if (!task) throw new HttpError(404, "Task not found");   // Express 5 catches this
    res.json(task);
  });

  tasks.post("/", async (req, res) => {
    const title = String(req.body.title ?? "").trim();
    if (!title) throw new HttpError(400, "title is required");
    const task = await taskRepo.create(req.user.id, { title });
    res.status(201).location(`/api/tasks/${task.id}`).json(task);
  });

  tasks.delete("/:id", async (req, res) => {
    await taskRepo.remove(req.user.id, req.params.id);
    res.status(204).end();
  });

  app.use("/api/tasks", tasks);
  app.get("/api/health", (_req, res) => res.json({ ok: true }));

  // ── 4. 404 for unknown routes
  app.use((req, _res, next) => next(new HttpError(404, `No route ${req.method} ${req.path}`)));

  // ── 5. Error handler: 4 arguments, registered LAST
  app.use((err, req, res, _next) => {
    const status = err.status ?? 500;
    if (status >= 500) console.error(req.id, err);           // log details server-side only
    res.status(status).json({ error: status >= 500 ? "Something went wrong" : err.message, requestId: req.id });
  });

  return app;
}

// src/index.js — keep "create app" separate from "listen" so tests can import the app
// const app = createApp({ taskRepo: new MongoTaskRepo() });
// app.listen(4000, () => console.log("API on :4000"));
</script>

// PostgreSQL from Node: raw SQL with `pg`, then a type-safe ORM option.
// npm i pg     ·   docker run -d -p 5432:5432 -e POSTGRES_PASSWORD=dev postgres:16
import pg from "pg";

const pool = new pg.Pool({
  connectionString: process.env.DATABASE_URL,   // postgres://user:pass@localhost:5432/jarvis
  max: 10,                                        // connection pool size
  idleTimeoutMillis: 30_000,
});

// ── Schema (run once, or via a migration tool)
await pool.query(`
  CREATE TABLE IF NOT EXISTS users (
    id         UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    email      TEXT UNIQUE NOT NULL,
    name       TEXT NOT NULL,
    created_at TIMESTAMPTZ NOT NULL DEFAULT now()
  );
  CREATE TABLE IF NOT EXISTS orders (
    id         BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
    user_id    UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
    amount     NUMERIC(10,2) NOT NULL CHECK (amount > 0),
    status     TEXT NOT NULL DEFAULT 'pending',
    created_at TIMESTAMPTZ NOT NULL DEFAULT now()
  );
  CREATE INDEX IF NOT EXISTS idx_orders_user ON orders (user_id, created_at DESC);
`);

// ── ALWAYS use parameters ($1, $2) — never string-concatenate user input (SQL injection)
export async function findUserByEmail(email) {
  const { rows } = await pool.query("SELECT id, email, name FROM users WHERE email = $1", [email]);
  return rows[0] ?? null;
}

// ── Joins + aggregation
export async function topCustomers(limit = 5) {
  const { rows } = await pool.query(
    `SELECT u.name, COUNT(o.id) AS orders, SUM(o.amount) AS spent
       FROM users u JOIN orders o ON o.user_id = u.id
      WHERE o.status = 'paid'
      GROUP BY u.id
      ORDER BY spent DESC
      LIMIT $1`, [limit]);
  return rows;
}

// ── Transactions: use ONE client for every statement in the transaction
export async function transfer(fromId, toId, amount) {
  const client = await pool.connect();
  try {
    await client.query("BEGIN");
    const { rows } = await client.query("SELECT balance FROM wallets WHERE user_id = $1 FOR UPDATE", [fromId]);
    if (!rows[0] || Number(rows[0].balance) < amount) throw new Error("Insufficient funds");
    await client.query("UPDATE wallets SET balance = balance - $1 WHERE user_id = $2", [amount, fromId]);
    await client.query("UPDATE wallets SET balance = balance + $1 WHERE user_id = $2", [amount, toId]);
    await client.query("COMMIT");
  } catch (err) {
    await client.query("ROLLBACK");
    throw err;
  } finally {
    client.release();                    // return the connection to the pool
  }
}

// ── Keyset pagination (fast at any depth; OFFSET gets slow)
export async function ordersPage(userId, cursor) {
  const { rows } = await pool.query(
    `SELECT * FROM orders WHERE user_id = $1 AND ($2::timestamptz IS NULL OR created_at < $2)
      ORDER BY created_at DESC LIMIT 20`, [userId, cursor ?? null]);
  return { rows, nextCursor: rows.at(-1)?.created_at ?? null };
}

// Prisma:  model User { id String @id @default(uuid())  email String @unique  orders Order[] }
//          const user = await prisma.user.findUnique({ where: { email }, include: { orders: true } });

// MongoDB with Mongoose: documents, schemas, indexes, aggregation.
// npm i mongoose   ·   docker run -d -p 27017:27017 mongo:7
import mongoose, { Schema } from "mongoose";

await mongoose.connect(process.env.MONGO_URI ?? "mongodb://localhost:27017/jarvis");

// ── Schema: shape, validation, defaults
const messageSchema = new Schema(
  {
    role: { type: String, enum: ["user", "assistant"], required: true },
    content: { type: String, required: true, maxlength: 20_000 },
    tools: [String],
  },
  { _id: false, timestamps: { createdAt: true, updatedAt: false } }
);

const conversationSchema = new Schema(
  {
    userId: { type: Schema.Types.ObjectId, ref: "User", required: true, index: true },
    title: { type: String, default: "New chat", trim: true },
    messages: [messageSchema],                  // EMBEDDED: read together, so store together
    archived: { type: Boolean, default: false },
  },
  { timestamps: true }
);

// Compound index matching the most common query
conversationSchema.index({ userId: 1, updatedAt: -1 });

// Instance method & virtual
conversationSchema.methods.addMessage = function (role, content) {
  this.messages.push({ role, content });
  return this.save();
};
conversationSchema.virtual("messageCount").get(function () { return this.messages.length; });

export const Conversation = mongoose.model("Conversation", conversationSchema);

// ── CRUD
const convo = await Conversation.create({ userId: new mongoose.Types.ObjectId(), title: "Weather" });
await convo.addMessage("user", "Will it rain in Pune?");

const recent = await Conversation.find({ userId: convo.userId, archived: false })
  .sort({ updatedAt: -1 })
  .limit(20)
  .select("title updatedAt")       // projection: only the fields you need
  .lean();                          // plain objects, faster for read-only

// Atomic update operators (no read-modify-write race)
await Conversation.updateOne(
  { _id: convo._id },
  { $push: { messages: { role: "assistant", content: "Yes, 70% chance." } }, $set: { title: "Pune rain" } }
);

// ── Aggregation pipeline: analytics inside the database
const stats = await Conversation.aggregate([
  { $match: { createdAt: { $gte: new Date("2026-10-01") } } },
  { $unwind: "$messages" },
  { $match: { "messages.role": "user" } },
  { $group: { _id: "$userId", questions: { $sum: 1 }, chats: { $addToSet: "$_id" } } },
  { $project: { questions: 1, chats: { $size: "$chats" } } },
  { $sort: { questions: -1 } },
  { $limit: 10 },
]);

// ── Transactions (needs a replica set)
const session = await mongoose.startSession();
await session.withTransaction(async () => {
  await Conversation.deleteMany({ userId: convo.userId }, { session });
  // await User.deleteOne({ _id: convo.userId }, { session });
});
session.endSession();

// Modelling rule: EMBED data you read together and that's bounded in size;
// REFERENCE data that is shared, unbounded, or updated independently.
// Note: a document's max size is 16MB, so very long chats should move messages to their own collection.
</script>

<script type="text/plain" data-code="rest-apis">
// REST API design: resources, verbs, status codes, validation, pagination, idempotency.
//
//   GET    /api/v1/conversations?limit=20&cursor=…   list (paginated)        200
//   POST   /api/v1/conversations                     create                  201 + Location
//   GET    /api/v1/conversations/:id                 read one                200 / 404
//   PATCH  /api/v1/conversations/:id                 partial update          200
//   DELETE /api/v1/conversations/:id                 delete                  204
//   POST   /api/v1/conversations/:id/messages        sub-resource / action   201
//
// Status codes: 400 bad input · 401 not signed in · 403 not allowed · 404 not found
//               409 conflict · 422 validation failed · 429 too many requests · 500 our bug
import express from "express";
import { z } from "zod";

const router = express.Router();

// ── Validation middleware (one reusable function)
const validate = (schema, where = "body") => (req, res, next) => {
  const result = schema.safeParse(req[where]);
  if (!result.success) {
    return res.status(422).json({
      error: { code: "VALIDATION_FAILED", message: "Invalid input", fields: result.error.flatten().fieldErrors },
    });
  }
  req.valid = { ...req.valid, [where]: result.data };
  next();
};

const ListQuery = z.object({
  limit: z.coerce.number().int().min(1).max(100).default(20),
  cursor: z.string().optional(),
  q: z.string().max(100).optional(),
});
const CreateBody = z.object({ title: z.string().min(1).max(120) });

// ── Cursor pagination with a consistent envelope
router.get("/conversations", validate(ListQuery, "query"), async (req, res) => {
  const { limit, cursor, q } = req.valid.query;
  const filter = { userId: req.user.id, ...(q && { title: { $regex: q, $options: "i" } }),
                   ...(cursor && { updatedAt: { $lt: new Date(cursor) } }) };
  const items = await Conversation.find(filter).sort({ updatedAt: -1 }).limit(limit + 1).lean();
  const hasMore = items.length > limit;
  const page = items.slice(0, limit);
  res.json({ data: page, nextCursor: hasMore ? page.at(-1).updatedAt.toISOString() : null });
});

// ── Idempotency: a retried POST must not create duplicates
const seen = new Map();   // use Redis in production, with a TTL
router.post("/conversations", validate(CreateBody), async (req, res) => {
  const key = req.get("Idempotency-Key");
  if (key && seen.has(key)) return res.status(201).json(seen.get(key));
  const convo = await Conversation.create({ userId: req.user.id, ...req.valid.body });
  if (key) seen.set(key, convo);
  res.status(201).location(`/api/v1/conversations/${convo.id}`).json(convo);
});

// ── Ownership check: 404 (not 403) so users can't probe other people's IDs
router.get("/conversations/:id", async (req, res) => {
  const convo = await Conversation.findOne({ _id: req.params.id, userId: req.user.id }).lean();
  if (!convo) return res.status(404).json({ error: { code: "NOT_FOUND", message: "Conversation not found" } });
  res.set("Cache-Control", "private, max-age=0").json(convo);
});

router.patch("/conversations/:id", validate(CreateBody.partial()), async (req, res) => {
  const convo = await Conversation.findOneAndUpdate(
    { _id: req.params.id, userId: req.user.id }, { $set: req.valid.body }, { new: true });
  if (!convo) return res.status(404).json({ error: { code: "NOT_FOUND", message: "Conversation not found" } });
  res.json(convo);
});

export default router;   // app.use("/api/v1", requireAuth, router)

// Also: document it with OpenAPI (swagger-ui-express), version in the URL (/v1),
// use plural nouns, never verbs in paths (/getUsers ✗), and return the same error shape everywhere.
</script>

<script type="text/plain" data-code="authentication">
// Authentication: hash passwords, issue short-lived access tokens, rotate refresh tokens.
import bcrypt from "bcryptjs";
import jwt from "jsonwebtoken";
import crypto from "node:crypto";

const ACCESS_SECRET = process.env.JWT_SECRET;            // long random string, from env
const ACCESS_TTL = "15m";
const REFRESH_TTL_MS = 30 * 24 * 3600 * 1000;

// ── 1. Passwords: slow, salted hash. Never store or log the plain password.
export const hashPassword = pw => bcrypt.hash(pw, 12);   // cost 12 ≈ 250ms
export const checkPassword = (pw, hash) => bcrypt.compare(pw, hash);

// ── 2. Access token: a short-lived JWT, sent as  Authorization: Bearer <token>
export function signAccess(user, sessionId) {
  return jwt.sign({ sub: user.id, role: user.role, sid: sessionId }, ACCESS_SECRET,
                  { expiresIn: ACCESS_TTL, algorithm: "HS256" });
}

// ── 3. Refresh token: random, stored HASHED, in an httpOnly cookie, rotated on every use
const sha256 = s => crypto.createHash("sha256").update(s).digest("hex");

export async function createSession(db, userId, userAgent) {
  const token = crypto.randomBytes(32).toString("base64url");
  const session = await db.sessions.insert({
    userId, tokenHash: sha256(token), userAgent,
    expiresAt: new Date(Date.now() + REFRESH_TTL_MS), revoked: false,
  });
  return { session, token };
}

export function setRefreshCookie(res, token) {
  res.cookie("rt", token, {
    httpOnly: true,            // JavaScript can't read it → safe from XSS theft
    secure: true,              // HTTPS only
    sameSite: "strict",        // not sent on cross-site requests → CSRF protection
    path: "/api/auth/refresh",
    maxAge: REFRESH_TTL_MS,
  });
}

// ── 4. Login: same error for "no user" and "wrong password" (no account discovery)
export async function login(db, { email, password }, res) {
  const user = await db.users.findByEmail(email);
  const locked = user?.lockedUntil && user.lockedUntil > new Date();
  if (locked) throw Object.assign(new Error("Account locked, try again later"), { status: 423 });
  const ok = user && await checkPassword(password, user.passwordHash);
  if (!ok) {
    if (user) await db.users.recordFailure(user.id);    // lock after 5 failures
    throw Object.assign(new Error("Invalid email or password"), { status: 401 });
  }
  const { session, token } = await createSession(db, user.id, res.req.get("user-agent"));
  setRefreshCookie(res, token);
  return { accessToken: signAccess(user, session.id) };
}

// ── 5. Refresh with rotation + reuse detection
export async function refresh(db, req, res) {
  const token = req.cookies.rt;
  const session = token && await db.sessions.findByHash(sha256(token));
  if (!session || session.expiresAt < new Date()) throw Object.assign(new Error("Sign in again"), { status: 401 });
  if (session.revoked) {
    await db.sessions.revokeAllForUser(session.userId);   // an OLD token was reused → likely stolen
    throw Object.assign(new Error("Sign in again"), { status: 401 });
  }
  await db.sessions.revoke(session.id);
  const next = await createSession(db, session.userId, req.get("user-agent"));
  setRefreshCookie(res, next.token);
  const user = await db.users.findById(session.userId);
  return { accessToken: signAccess(user, next.session.id) };
}

// ── 6. Middleware: verify the access token on protected routes
export function requireAuth(req, _res, next) {
  const header = req.get("authorization") ?? "";
  const token = header.startsWith("Bearer ") ? header.slice(7) : "";
  try {
    const p = jwt.verify(token, ACCESS_SECRET, { algorithms: ["HS256"] });
    req.user = { id: p.sub, role: p.role, sid: p.sid };
    next();
  } catch {
    next(Object.assign(new Error("Not signed in"), { status: 401 }));
  }
}
export const requireRole = role => (req, _res, next) =>
  req.user?.role === role ? next() : next(Object.assign(new Error("Forbidden"), { status: 403 }));

// Also learn: OTP / 2FA, OAuth 2.0 + OpenID Connect ("Sign in with Google"), passkeys (WebAuthn),
// rate limiting login, timing-safe comparisons (crypto.timingSafeEqual), and audit logs.
</script>

<script type="text/plain" data-code="redis">
// Redis: in-memory data store for caching, rate limits, sessions, queues and pub/sub.
// npm i redis   ·   docker run -d -p 6379:6379 redis:7
import { createClient } from "redis";

const redis = createClient({ url: process.env.REDIS_URL ?? "redis://localhost:6379" });
redis.on("error", err => console.error("redis", err));
await redis.connect();

// ── 1. Cache-aside: check cache → miss → load from DB → store with a TTL
export async function getUserProfile(userId, loadFromDb) {
  const key = `user:${userId}:profile`;
  const cached = await redis.get(key);
  if (cached) return JSON.parse(cached);
  const profile = await loadFromDb(userId);
  await redis.set(key, JSON.stringify(profile), { EX: 300 });   // expires in 5 min
  return profile;
}
export const invalidateProfile = userId => redis.del(`user:${userId}:profile`);   // on update

// ── 2. Rate limiting: fixed window with INCR + EXPIRE (atomic via MULTI)
export async function allow(ip, limit = 100, windowSec = 60) {
  const key = `rl:${ip}:${Math.floor(Date.now() / 1000 / windowSec)}`;
  const [count] = await redis.multi().incr(key).expire(key, windowSec).exec();
  return count <= limit;
}
export const rateLimit = (limit, windowSec) => async (req, res, next) =>
  (await allow(req.ip, limit, windowSec)) ? next() : res.status(429).json({ error: "Too many requests" });

// ── 3. OTP codes with automatic expiry
await redis.set(`otp:login:${"u1"}`, "hashed-code", { EX: 300, NX: true });   // NX: only if not already set

// ── 4. Distributed lock: only one server runs the job
const gotLock = await redis.set("lock:daily-report", "server-a", { NX: true, PX: 30_000 });
if (gotLock) { /* run job */ }

// ── 5. Data structures beyond strings
await redis.hSet("session:abc", { userId: "u1", device: "Chrome" });       // hash
await redis.zAdd("leaderboard", [{ score: 420, value: "aamir" }]);          // sorted set
const top = await redis.zRangeWithScores("leaderboard", 0, 9, { REV: true });
await redis.sAdd("online-users", "u1");                                      // set
await redis.lPush("recent:u1", "msg-id"); await redis.lTrim("recent:u1", 0, 49);   // capped list

// ── 6. Pub/Sub: broadcast events to every server instance (e.g. WebSocket fan-out)
const sub = redis.duplicate(); await sub.connect();
await sub.subscribe("chat:events", msg => console.log("event", JSON.parse(msg)));
await redis.publish("chat:events", JSON.stringify({ type: "message", convoId: "c1" }));

// ── 7. Background jobs with BullMQ (built on Redis)
// import { Queue, Worker } from "bullmq";
// const emails = new Queue("emails", { connection: { url: process.env.REDIS_URL } });
// await emails.add("otp", { to: "a@b.com", code: "123456" }, { attempts: 3, backoff: { type: "exponential", delay: 1000 } });
// new Worker("emails", async job => sendEmail(job.data), { connection: { url: process.env.REDIS_URL } });

// Remember: Redis lives in RAM — set TTLs, don't keep data you can't afford to lose there
// without persistence (AOF/RDB), and name keys consistently: app:entity:id:field

// ── tasks/dto/create-task.dto.ts — validated with class-validator
import { IsString, Length, IsOptional, IsISO8601 } from "class-validator";
export class CreateTaskDto {
  @IsString() @Length(1, 200) title: string;
  @IsOptional() @IsISO8601() remindAt?: string;
}

// ── tasks/tasks.service.ts — business logic, injectable
import { Injectable, NotFoundException } from "@nestjs/common";
import { InjectModel } from "@nestjs/mongoose";
import { Model } from "mongoose";
import { Task } from "./task.schema";

@Injectable()
export class TasksService {
  constructor(@InjectModel(Task.name) private tasks: Model<Task>) {}   // injected by Nest

  findAll(userId: string) {
    return this.tasks.find({ userId }).sort({ createdAt: -1 }).lean();
  }
  create(userId: string, dto: CreateTaskDto) {
    return this.tasks.create({ ...dto, userId });
  }
  async complete(userId: string, id: string) {
    const task = await this.tasks.findOneAndUpdate({ _id: id, userId }, { done: true }, { new: true });
    if (!task) throw new NotFoundException("Task not found");            // → 404 automatically
    return task;
  }
}

// ── tasks/tasks.controller.ts — HTTP layer
import { Controller, Get, Post, Patch, Body, Param, UseGuards } from "@nestjs/common";
import { JwtAuthGuard } from "../auth/jwt.guard";
import { CurrentUser } from "../auth/current-user.decorator";

@Controller("tasks")
@UseGuards(JwtAuthGuard)                                 // guard = auth check before handler
export class TasksController {
  constructor(private readonly tasksService: TasksService) {}

  @Get()
  findAll(@CurrentUser() user: { id: string }) {
    return this.tasksService.findAll(user.id);
  }

  @Post()
  create(@CurrentUser() user: { id: string }, @Body() dto: CreateTaskDto) {   // body already validated
    return this.tasksService.create(user.id, dto);
  }

  @Patch(":id/complete")
  complete(@CurrentUser() user: { id: string }, @Param("id") id: string) {
    return this.tasksService.complete(user.id, id);
  }
}

// ── tasks/tasks.module.ts — wires it together
import { Module } from "@nestjs/common";
import { MongooseModule } from "@nestjs/mongoose";
import { TaskSchema } from "./task.schema";

@Module({
  imports: [MongooseModule.forFeature([{ name: Task.name, schema: TaskSchema }])],
  controllers: [TasksController],
  providers: [TasksService],
  exports: [TasksService],
})
export class TasksModule {}

// ── main.ts

await app.listen(4000);

// Testing a Node API: unit tests for logic, integration tests for HTTP routes.
// Built-in runner:  node --test     (or Jest / Vitest — same ideas)
// npm i -D supertest
import { describe, it, beforeEach, mock } from "node:test";
import assert from "node:assert/strict";
import request from "supertest";
import { createApp } from "../src/app.js";

// ── Fake repository: tests run in milliseconds, no database needed
class MemoryTaskRepo {
  constructor() { this.rows = []; }
  async list(userId) { return this.rows.filter(r => r.userId === userId); }
  async get(userId, id) { return this.rows.find(r => r.userId === userId && r.id === id) ?? null; }
  async create(userId, data) { const row = { id: String(this.rows.length + 1), userId, done: false, ...data }; this.rows.push(row); return row; }
  async remove(userId, id) { this.rows = this.rows.filter(r => !(r.userId === userId && r.id === id)); }
}

describe("Tasks API", () => {
  let app, repo;
  beforeEach(() => {
    repo = new MemoryTaskRepo();
    app = createApp({ taskRepo: repo });            // dependency injection pays off here
  });

  it("rejects requests without a user", async () => {
    const res = await request(app).get("/api/tasks");
    assert.equal(res.status, 401);
  });

  it("creates a task and returns 201 with a Location header", async () => {
    const res = await request(app)
      .post("/api/tasks")
      .set("x-user-id", "u1")
      .send({ title: "  Learn testing  " });
    assert.equal(res.status, 201);
    assert.equal(res.body.title, "Learn testing");    // trimmed
    assert.match(res.headers.location, /\/api\/tasks\/\d+/);
  });

  it("validates the title", async () => {
    const res = await request(app).post("/api/tasks").set("x-user-id", "u1").send({});
    assert.equal(res.status, 400);
    assert.equal(res.body.error, "title is required");
  });

  it("never shows one user's task to another (404, not 403)", async () => {
    const { body } = await request(app).post("/api/tasks").set("x-user-id", "u1").send({ title: "secret" });
    const res = await request(app).get(`/api/tasks/${body.id}`).set("x-user-id", "u2");
    assert.equal(res.status, 404);
  });

  it("returns a generic 500 and hides internals", async () => {
    repo.list = mock.fn(async () => { throw new Error("db password wrong"); });
    const res = await request(app).get("/api/tasks").set("x-user-id", "u1");
    assert.equal(res.status, 500);
    assert.doesNotMatch(JSON.stringify(res.body), /password/);
  });
});

// ── Unit test with mocked time and dependencies
describe("OTP expiry", () => {
  it("rejects a code after 5 minutes", () => {
    mock.timers.enable({ apis: ["Date"], now: 0 });
    const issuedAt = Date.now();
    mock.timers.tick(5 * 60_000 + 1);
    assert.ok(Date.now() - issuedAt > 5 * 60_000);
    mock.timers.reset();
  });
});

// Test pyramid: many unit tests · some integration (HTTP + real DB in Docker / Testcontainers)
// · few end-to-end. Run in CI on every push. Coverage: node --test --experimental-test-coverage

<script type="text/plain" data-code="aws">
// AWS SDK v3 for JavaScript: import only the clients you use.
// npm i @aws-sdk/client-s3 @aws-sdk/s3-request-presigner @aws-sdk/client-sesv2 @aws-sdk/client-sns @aws-sdk/client-secrets-manager
import { S3Client, PutObjectCommand, GetObjectCommand } from "@aws-sdk/client-s3";
import { getSignedUrl } from "@aws-sdk/s3-request-presigner";
import { SESv2Client, SendEmailCommand } from "@aws-sdk/client-sesv2";
import { SNSClient, PublishCommand } from "@aws-sdk/client-sns";
import { SecretsManagerClient, GetSecretValueCommand } from "@aws-sdk/client-secrets-manager";

const region = process.env.AWS_REGION ?? "ap-south-1";
// Credentials come from the environment / ~/.aws locally, and from the IAM ROLE in the cloud.

// ── S3: let the browser upload directly with a presigned URL (your server never handles the bytes)
const s3 = new S3Client({ region });
export async function uploadUrl(userId, filename, contentType) {
  const key = `users/${userId}/${crypto.randomUUID()}-${filename}`;
  const url = await getSignedUrl(s3, new PutObjectCommand({ Bucket: process.env.BUCKET, Key: key, ContentType: contentType }), { expiresIn: 300 });
  return { key, url };       // frontend: fetch(url, { method: "PUT", body: file })
}
export const downloadUrl = key =>
  getSignedUrl(s3, new GetObjectCommand({ Bucket: process.env.BUCKET, Key: key }), { expiresIn: 300 });

// ── SES: transactional email (OTP codes, receipts)
const ses = new SESv2Client({ region });
export async function sendOtpEmail(to, code) {
  await ses.send(new SendEmailCommand({
    FromEmailAddress: process.env.SES_FROM_EMAIL,         // must be a verified sender
    Destination: { ToAddresses: [to] },
    Content: { Simple: {
      Subject: { Data: "Your Jarvis sign-in code" },
      Body: { Text: { Data: `Your code is ${code}. It expires in 5 minutes.` } },
    } },
  }));
}

// ── SNS: SMS
const sns = new SNSClient({ region });
export const sendSms = (phone, text) =>
  sns.send(new PublishCommand({ PhoneNumber: phone, Message: text,
    MessageAttributes: { "AWS.SNS.SMS.SMSType": { DataType: "String", StringValue: "Transactional" } } }));

// ── Secrets Manager: load secrets at startup, not from code
export async function loadSecrets(name) {
  const sm = new SecretsManagerClient({ region });
  const { SecretString } = await sm.send(new GetSecretValueCommand({ SecretId: name }));
  return JSON.parse(SecretString);
}

// Hosting a Node API on AWS:
//   ECS Fargate or App Runner  ← container from ECR, behind an Application Load Balancer
//   Lambda + API Gateway       ← serverless, pay per request
//   RDS (Postgres) · DocumentDB / MongoDB Atlas · ElastiCache (Redis)
//   CloudWatch (logs, alarms) · Route 53 (DNS) · ACM (HTTPS certs) · WAF (attack filtering)
//   IAM: one role per service, least privilege. VPC: databases in private subnets.
// Infra as code: AWS CDK (TypeScript!) or Terraform — never click-configure production.
</script>

# System design: Jarvis for 1 million users

## 1. Requirements
Functional:  sign in · chat with streaming answers · tasks & reminders · upload docs (RAG)
Non-functional: p95 API latency < 300ms (excluding LLM) · 99.9% uptime · data private per user

## 2. Back-of-envelope numbers
1M users × 10% daily active        = 100k DAU
100k × 20 messages/day              = 2M messages/day ≈ 23/s average, ~100/s peak
Message ≈ 2 KB → 2M × 2 KB          = 4 GB/day → ~1.5 TB/year of chat history
LLM call ≈ 3s → 100/s × 3s          = ~300 concurrent streams at peak (needs async I/O, not threads)

## 3. High-level architecture
  Clients ──► CDN (static app)
     │
     ▼
  Load balancer ──► API servers (stateless Node, N replicas, autoscale on CPU/RPS)
                       │        │            │              │
                    Redis    MongoDB      Postgres       Queue (SQS/BullMQ)
              (sessions, rate (chats,     (users, tasks,       │
              limits, cache)   sharded by  billing)            ▼
                               userId)                   Workers: email/SMS, RAG ingestion,
                                                         reminders  ──► S3 (files) · Vector DB
                       │
                       └──► AI service (FastAPI) ──► LLM provider

## 4. Key decisions & trade-offs
- Stateless API servers: any server can handle any request → scale horizontally.
  Session state lives in Redis / JWT, never in server memory.
- Read-heavy data (profiles, settings) → cache-aside in Redis with TTL + invalidate on write.
- Slow work (emails, PDF embedding) → queue + workers, return 202 Accepted immediately.
- Chats in MongoDB (flexible, append-heavy, shard by userId);
  money/users in Postgres (transactions, constraints).
- Real-time streaming: SSE for LLM tokens; WebSockets + Redis pub/sub if servers must fan out.
- Rate limit per user and per IP at the gateway; per-user LLM token budgets to cap cost.
- CAP: for chat history, prefer availability (eventual consistency is fine);
  for payments, prefer consistency.

## 5. Reliability
- Health checks + autoscaling · multi-AZ databases · backups with tested restores
- Timeouts, retries with exponential backoff + jitter, circuit breaker on the LLM provider
- Idempotency keys on POSTs · dead-letter queue for failed jobs
- Observability: structured logs with request IDs, metrics (RPS, p95, error rate), tracing (OpenTelemetry), alerts

## 6. Scaling path
1 server + 1 DB  →  add Redis cache  →  N API replicas behind a LB  →  read replicas
→  queue + workers  →  shard the biggest collection  →  split services when teams/load require it

## Interview checklist
Clarify requirements → estimate scale → draw boxes → design data model & APIs
→ find the bottleneck → scale it → discuss failure modes & trade-offs

<script>
(function () {
  const KEY = META.key;
  let done = new Set();
  try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) {} };

  const code = {};
  document.querySelectorAll('script[data-code]').forEach(el => {
    code[el.dataset.code] = el.textContent.replace(/^\n/, "").replace(/\s+$/, "");
  });

  const route = document.getElementById("route");
  const picker = document.getElementById("picker");
  const lesson = document.getElementById("lesson");
  document.getElementById("count").textContent = L.length;

  // Build nav
  STAGES.forEach(st => {
    const items = L.filter(l => l.s === st.n);
    const div = document.createElement("div");
    div.className = "stage";
    div.innerHTML = `<div class="stage-h"><span class="stage-n">${st.n}</span><span class="stage-t">${st.title}</span></div><ul></ul>`;
    const ul = div.querySelector("ul");
    const og = document.createElement("optgroup");
    og.label = `${st.n}. ${st.title}`;
    items.forEach(l => {
      const li = document.createElement("li");
      li.innerHTML = `<button type="button" data-id="${l.id}"><span class="dot"></span><span>${l.name}</span></button>`;
      ul.appendChild(li);
      const opt = document.createElement("option");
      opt.value = l.id; opt.textContent = l.name;
      og.appendChild(opt);
    });
    route.appendChild(div);
    picker.appendChild(og);
  });
  route.addEventListener("click", e => {
    const b = e.target.closest("button[data-id]");
    if (b) go(b.dataset.id);
  });
  picker.addEventListener("change", () => go(picker.value));

  function go(id) {
    if (location.hash.slice(1) !== id) location.hash = id;
    else show(id);
  }

  function refreshProgress() {
    const n = L.filter(l => done.has(l.id)).length;
    document.getElementById("pct").textContent = `${n} / ${L.length} done`;
    document.getElementById("barfill").style.width = (n / L.length * 100) + "%";
    route.querySelectorAll("button[data-id]").forEach(b => b.parentElement.classList.toggle("done", done.has(b.dataset.id)));
  }

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  function show(id) {
    const i = Math.max(0, L.findIndex(l => l.id === id));
    const l = L[i];
    const st = STAGES[l.s - 1];
    const prev = L[i - 1], next = L[i + 1];
    const src = code[l.id] || "";
    let highlighted = esc(src);
    try {
      if (window.hljs && hljs.getLanguage(l.lang)) highlighted = hljs.highlight(src, { language: l.lang }).value;
    } catch (e) {}
    const isDone = done.has(l.id);

    lesson.innerHTML = `
      <div class="cat">Stage ${st.n} · ${st.title} · ${l.cat}</div>
      <h2>${l.name}</h2>
      <p class="what">${l.what}</p>
      <div class="grid2">
        <div class="box"><h3>Concepts to master</h3><ul>${l.concepts.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>
        <div class="box"><h3>Why it matters</h3><p>${l.why}</p></div>
      </div>
      <div class="code">
        <div class="code-bar"><span class="file">${esc(l.file)}</span><button class="copy" type="button" id="copy-btn">Copy code</button></div>
        <pre><code>${highlighted}</code></pre>
      </div>
      <div class="tip"><b>Pro tip</b><p>${l.tip}</p></div>
      ${l.jarvis ? `<div class="tip jarvis"><b>In Jarvis</b><p>${l.jarvis}</p></div>` : ""}
      <div class="actions">
        <button class="btn ${isDone ? "is-done" : "primary"}" type="button" id="done-btn">${isDone ? "✓ Learned" : "Mark as learned"}</button>
        <div class="nav-pair">
          <button class="btn" type="button" id="prev-btn" ${prev ? "" : "disabled"}>← ${prev ? esc(prev.name) : "Start"}</button>
          <button class="btn" type="button" id="next-btn" ${next ? "" : "disabled"}>${next ? esc(next.name) : "Finished"} →</button>
        </div>
      </div>`;

    document.getElementById("copy-btn").addEventListener("click", e => {
      const btn = e.currentTarget;
      const ok = () => { btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy code"), 1500); };
      const fallback = () => {
        const range = document.createRange();
        range.selectNodeContents(lesson.querySelector("pre code"));
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
        btn.textContent = "Selected — press Ctrl+C";
      };
      try { navigator.clipboard.writeText(src).then(ok, fallback); } catch (err) { fallback(); }
    });
    document.getElementById("done-btn").addEventListener("click", () => {
      done.has(l.id) ? done.delete(l.id) : done.add(l.id);
      save(); refreshProgress(); show(l.id);
    });
    if (prev) document.getElementById("prev-btn").addEventListener("click", () => go(prev.id));
    if (next) document.getElementById("next-btn").addEventListener("click", () => go(next.id));

    route.querySelectorAll("button[data-id]").forEach(b => b.setAttribute("aria-current", b.dataset.id === l.id ? "true" : "false"));
    picker.value = l.id;
    refreshProgress();
  }

  window.addEventListener("hashchange", () => { show(location.hash.slice(1)); window.scrollTo({ top: 0 }); });
  show(location.hash.slice(1) || L[0].id);
})();
</script>
