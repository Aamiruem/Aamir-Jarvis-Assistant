from dataclasses import dataclass, field

import functools, time

def timed(fn):
    @functools.wraps(fn)
    def wrapper(*args, **kwargs):
        start = time.perf_counter()
        try:
            return fn(*args, **kwargs)
        finally:
            print(f"{fn.__name__} took {(time.perf_counter() - start) * 1000:.1f}ms")
    return wrapper

# ── async / await: thousands of I/O waits on one thread (FastAPI is built on this)
import asyncio, httpx

async def fetch_all(urls: list[str]) -> list[int]:
    async with httpx.AsyncClient(timeout=10) as client:
        responses = await asyncio.gather(*(client.get(u) for u in urls))
    return [r.status_code for r in responses]

<script type="text/plain" data-code="sql">
-- ── Create tables with constraints
CREATE TABLE users (
  id          SERIAL PRIMARY KEY,
  email       VARCHAR(255) UNIQUE NOT NULL,
  name        TEXT NOT NULL,
  created_at  TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
);

CREATE TABLE tasks (
  id          SERIAL PRIMARY KEY,
  user_id     INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,   -- foreign key
  title       TEXT NOT NULL,
  priority    INTEGER NOT NULL DEFAULT 3 CHECK (priority BETWEEN 1 AND 5),
  done        BOOLEAN NOT NULL DEFAULT FALSE,
  due_at      TIMESTAMP
);

-- ── CRUD
INSERT INTO users (email, name) VALUES ('aamir@example.com', 'Aamir'), ('manish@example.com', 'Manish');
INSERT INTO tasks (user_id, title, priority, due_at)
VALUES (1, 'Learn SQL', 1, '2026-11-01 10:00'), (1, 'Buy milk', 4, NULL), (2, 'Deploy API', 2, NULL);

SELECT id, title FROM tasks WHERE user_id = 1 AND done = FALSE ORDER BY priority, due_at NULLS LAST LIMIT 10;
UPDATE tasks SET done = TRUE WHERE id = 2;
DELETE FROM tasks WHERE done = TRUE AND due_at < CURRENT_DATE - INTERVAL '30 days';

-- ── Filtering
SELECT * FROM tasks WHERE title LIKE '%SQL%';            -- pattern
SELECT * FROM tasks WHERE priority IN (1, 2);
SELECT * FROM tasks WHERE due_at IS NULL;               -- never "= NULL"

-- ── JOINs: combine tables
SELECT u.name, t.title
FROM tasks t
JOIN users u ON u.id = t.user_id;                        -- INNER: only matching rows

SELECT u.name, COUNT(t.id) AS task_count                 -- LEFT: keep users with zero tasks
FROM users u
LEFT JOIN tasks t ON t.user_id = u.id
GROUP BY u.name;

-- ── Aggregation: GROUP BY + HAVING (filter AFTER grouping)
SELECT user_id,
       COUNT(*)                                   AS total,
       SUM(CASE WHEN done THEN 1 ELSE 0 END)      AS completed,
       ROUND(AVG(priority), 2)                    AS avg_priority
FROM tasks
GROUP BY user_id
HAVING COUNT(*) >= 2;

-- ── Subquery: users who have an urgent open task
SELECT name FROM users
WHERE id IN (SELECT user_id FROM tasks WHERE priority = 1 AND NOT done);

-- ── CTE (WITH): readable multi-step queries
WITH stats AS (
  SELECT user_id, COUNT(*) FILTER (WHERE done) * 100.0 / COUNT(*) AS pct_done
  FROM tasks GROUP BY user_id
)
SELECT u.name, s.pct_done FROM stats s JOIN users u ON u.id = s.user_id ORDER BY s.pct_done DESC;

-- ── Window functions: calculate across rows WITHOUT collapsing them
SELECT user_id, title, priority,
       RANK()       OVER (PARTITION BY user_id ORDER BY priority) AS rank_in_user,
       COUNT(*)     OVER (PARTITION BY user_id)                   AS user_total
FROM tasks;

-- ── Transactions: all or nothing
BEGIN;
  UPDATE accounts SET balance = balance - 500 WHERE id = 1;
  UPDATE accounts SET balance = balance + 500 WHERE id = 2;
COMMIT;      -- or ROLLBACK; if anything failed

-- ── Indexes: make WHERE / JOIN / ORDER BY fast
CREATE INDEX idx_tasks_user_done ON tasks (user_id, done);

  user_id   UUID NOT NULL,
  content   TEXT NOT NULL,
  embedding vector(384)
);
CREATE INDEX ON chunks USING hnsw (embedding vector_cosine_ops);
SELECT content, 1 - (embedding <=> $1) AS similarity      -- <=> = cosine distance
FROM chunks WHERE user_id = $2 ORDER BY embedding <=> $1 LIMIT 5;

<script type="text/plain" data-code="fastapi">
# app/main.py — run:  uvicorn app.main:app --reload    docs: http://localhost:8000/docs
from datetime import datetime
from typing import Annotated
from fastapi import FastAPI, APIRouter, Depends, HTTPException, Header, Query, status, BackgroundTasks
from pydantic import BaseModel, Field, ConfigDict

# ── Pydantic models: validation + serialization + OpenAPI docs, from type hints
class TaskCreate(BaseModel):
    title: str = Field(min_length=1, max_length=200)
    priority: int = Field(default=3, ge=1, le=5)
    remind_at: datetime | None = None

class TaskOut(TaskCreate):
    model_config = ConfigDict(from_attributes=True)   # build from ORM objects
    id: int
    done: bool

# ── Dependencies: reusable, injectable, testable
FAKE_DB: dict[int, dict] = {}

def get_db():
    db = FAKE_DB            # real app: yield a SQLAlchemy Session, close it after
    try:
        yield db
    finally:
        pass

def current_user(x_user_id: Annotated[str | None, Header()] = None) -> str:
    if not x_user_id:
        raise HTTPException(status.HTTP_401_UNAUTHORIZED, "Missing X-User-Id")
    return x_user_id

DB = Annotated[dict, Depends(get_db)]
User = Annotated[str, Depends(current_user)]

# ── Routers group endpoints
router = APIRouter(prefix="/tasks", tags=["tasks"])

@router.get("", response_model=list[TaskOut])
def list_tasks(db: DB, user: User,
               done: bool | None = None,
               limit: Annotated[int, Query(ge=1, le=100)] = 20):
    rows = [t for t in db.values() if t["user_id"] == user and (done is None or t["done"] == done)]
    return rows[:limit]

@router.post("", response_model=TaskOut, status_code=status.HTTP_201_CREATED)
def create_task(body: TaskCreate, db: DB, user: User, background: BackgroundTasks):
    task_id = len(db) + 1
    db[task_id] = {"id": task_id, "user_id": user, "done": False, **body.model_dump()}
    background.add_task(print, f"audit: {user} created task {task_id}")   # runs after response
    return db[task_id]

@router.patch("/{task_id}", response_model=TaskOut)
def complete_task(task_id: int, db: DB, user: User):
    task = db.get(task_id)
    if not task or task["user_id"] != user:
        raise HTTPException(404, "Task not found")        # same error: don't leak existence
    task["done"] = True
    return task

# ── async endpoints for I/O (LLM calls, HTTP, async DB drivers)
@router.get("/{task_id}/suggest")
async def suggest(task_id: int, user: User):
    import asyncio
    await asyncio.sleep(0.1)                               # pretend: await claude call
    return {"suggestion": "Break it into 3 smaller steps."}

app = FastAPI(title="Jarvis AI Service")
app.include_router(router)

@app.get("/health")
def health():
    return {"status": "ok"}

# ── Streaming (Server-Sent Events) for LLM tokens
from fastapi.responses import StreamingResponse

@app.get("/stream")
async def stream():
    async def gen():
        for word in "Hello from Jarvis".split():
            yield f"data: {word}\n\n"
    return StreamingResponse(gen(), media_type="text/event-stream")

# A layered FastAPI service. Each layer only talks to the one below it.
#
#   app/
#   ├─ main.py             app factory, middleware, lifespan (startup/shutdown)
#   ├─ config.py           settings from environment (pydantic-settings)
#   ├─ routers/            HTTP layer: parse request → call service → shape response
#   ├─ services/           business rules (no FastAPI imports here!)
#   ├─ repositories/       data access (SQL, Mongo, S3) behind an interface
#   ├─ models/ schemas/    ORM tables / Pydantic DTOs
#   └─ tests/
#
#   Request → Router → Service → Repository → DB
#                 ↑ dependencies injected via Depends()

# ── config.py: 12-factor config, validated at startup
from pydantic_settings import BaseSettings, SettingsConfigDict

class Settings(BaseSettings):
    model_config = SettingsConfigDict(env_file=".env", extra="ignore")
    database_url: str = "sqlite:///data/jarvis.db"
    anthropic_api_key: str = ""
    internal_key: str                       # required → app refuses to start without it
    log_level: str = "INFO"

settings = Settings()

# ── repositories/tasks.py: one place that knows about SQL
from typing import Protocol

class TaskRepo(Protocol):
    def add(self, user_id: str, title: str) -> dict: ...
    def list_open(self, user_id: str) -> list[dict]: ...

class InMemoryTaskRepo:                    # used in tests — no database needed
    def __init__(self): self.rows: list[dict] = []
    def add(self, user_id, title):
        row = {"id": len(self.rows) + 1, "user_id": user_id, "title": title, "done": False}
        self.rows.append(row); return row
    def list_open(self, user_id):
        return [r for r in self.rows if r["user_id"] == user_id and not r["done"]]

# ── services/tasks.py: rules live here, framework-free and easy to unit test
class TooManyTasks(Exception): ...

class TaskService:
    MAX_OPEN = 50
    def __init__(self, repo: TaskRepo):
        self.repo = repo
    def create(self, user_id: str, title: str) -> dict:
        if len(self.repo.list_open(user_id)) >= self.MAX_OPEN:
            raise TooManyTasks("Finish some tasks first")
        return self.repo.add(user_id, title.strip())

# ── routers/tasks.py: thin HTTP adapter
from fastapi import APIRouter, Depends, FastAPI, HTTPException, Request
from fastapi.responses import JSONResponse

_repo = InMemoryTaskRepo()
def get_service() -> TaskService:
    return TaskService(_repo)

router = APIRouter()

@router.post("/tasks", status_code=201)
def create(title: str, svc: TaskService = Depends(get_service)):
    return svc.create("u1", title)

# ── main.py: map domain errors to HTTP in ONE place
app = FastAPI()
app.include_router(router)

@app.exception_handler(TooManyTasks)
async def too_many(_: Request, exc: TooManyTasks):
    return JSONResponse(status_code=409, content={"error": str(exc)})

# In tests:  app.dependency_overrides[get_service] = lambda: TaskService(InMemoryTaskRepo())
#
# Cross-cutting concerns to design for:
#   structured logging + request IDs · health/readiness endpoints · timeouts & retries on
#   outbound calls · idempotency keys on POST · pagination · background jobs (Celery/ARQ)
#   · caching (Redis) · rate limiting · migrations (Alembic) · secrets outside code

X_std = (X - X.mean(axis=0)) / X.std(axis=0)          # (100,3) - (3,) → per-column standardization

# ── Aggregations along axes

m.mean(axis=1)   # per row
np.argmax(m, axis=1)

# ── Linear algebra: the language of ML
W = np.random.default_rng(2).normal(size=(3, 2))
H = X @ W                                  # matrix multiply (100,3)@(3,2) → (100,2)

# ── Cosine similarity: the core of semantic search / RAG
def cosine_sim(query: np.ndarray, docs: np.ndarray) -> np.ndarray:
    q = query / np.linalg.norm(query)
    d = docs / np.linalg.norm(docs, axis=1, keepdims=True)
    return d @ q                                         # one score per document

docs = np.random.default_rng(3).normal(size=(5, 384))  # 5 embeddings
query = docs[2] + 0.1                                  # close to doc 2
scores = cosine_sim(query, docs)
top_k = np.argsort(scores)[::-1][:3]                   # best 3 indices
print(top_k, scores[top_k].round(3))

# ── A tiny neural layer, by hand
def relu(x): return np.maximum(0, x)
def softmax(x):
    e = np.exp(x - x.max(axis=1, keepdims=True))       # subtract max for numerical stability
    return e / e.sum(axis=1, keepdims=True)
probs = softmax(relu(X @ W))                           # (100, 2), rows sum to 1

import numpy as np
from scipy import stats

rng = np.random.default_rng(42)
latency = rng.gamma(shape=2, scale=300, size=1000)       # skewed, like real response times

# ── Descriptive statistics
mean, median = latency.mean(), np.median(latency)
std = latency.std(ddof=1)                                 # sample std (ddof=1)
p95 = np.percentile(latency, 95)
iqr = np.subtract(*np.percentile(latency, [75, 25]))
print(f"mean={mean:.0f} median={median:.0f} std={std:.0f} p95={p95:.0f}")
# Skewed data → mean > median. Report median and p95 for latency, not just the mean.

# ── Outliers with z-scores and IQR
z = (latency - mean) / std
outliers_z = latency[np.abs(z) > 3]
q1, q3 = np.percentile(latency, [25, 75])
outliers_iqr = latency[(latency < q1 - 1.5 * iqr) | (latency > q3 + 1.5 * iqr)]

# ── Probability distributions
stats.norm(0, 1).cdf(1.96)        # 0.975 → 95% of a normal lies within ±1.96σ
stats.binom(n=20, p=0.1).pmf(3)   # P(exactly 3 errors in 20 requests)

# ── Central limit theorem: means of samples are ~normal, whatever the data
sample_means = [rng.choice(latency, 50).mean() for _ in range(2000)]

# ── Confidence interval for the mean
ci = stats.t.interval(0.95, df=len(latency) - 1, loc=mean, scale=stats.sem(latency))
print("95% CI:", np.round(ci, 1))

# ── Bootstrap CI: works for any statistic (median, p95…)
boot = [np.median(rng.choice(latency, len(latency))) for _ in range(5000)]
print("median 95% CI:", np.percentile(boot, [2.5, 97.5]).round(1))

# ── Hypothesis test: is the new prompt faster? (A/B test)
a = rng.gamma(2, 300, 400)        # old
b = rng.gamma(2, 270, 400)        # new
t, p = stats.ttest_ind(a, b, equal_var=False)     # Welch's t-test
u, p_mw = stats.mannwhitneyu(a, b)                # non-parametric (skewed data)
print(f"p={p:.4f}  → {'significant' if p < 0.05 else 'not significant'} at α=0.05")
# p-value = chance of seeing a difference this big IF there were no real difference.

# ── Conversion rates: chi-square test
#            thumbs_up  thumbs_down
table = np.array([[420, 80],      # prompt A
                  [465, 35]])     # prompt B
chi2, p, *_ = stats.chi2_contingency(table)

# ── Correlation (≠ causation)
tokens = rng.integers(50, 2000, 1000)
lat = 200 + tokens * 0.4 + rng.normal(0, 100, 1000)
r, p = stats.pearsonr(tokens, lat)            # linear
rho, p = stats.spearmanr(tokens, lat)         # rank-based, robust

# ── Simple linear regression
res = stats.linregress(tokens, lat)
print(f"latency ≈ {res.intercept:.0f} + {res.slope:.2f}·tokens  (R²={res.rvalue**2:.2f})")

# ── Bayes' rule, by hand: P(spam | flagged)
p_spam, p_flag_given_spam, p_flag_given_ham = 0.02, 0.95, 0.05
p_flag = p_flag_given_spam * p_spam + p_flag_given_ham * (1 - p_spam)
print("P(spam|flagged) =", round(p_flag_given_spam * p_spam / p_flag, 3))   # only ~0.28!

# Intent classification with scikit-learn: text → label (weather, reminder, math, chat…)
import json
import joblib
import numpy as np
from sklearn.feature_extraction.text import TfidfVectorizer
from sklearn.linear_model import LogisticRegression
from sklearn.model_selection import train_test_split, cross_val_score, GridSearchCV, StratifiedKFold
from sklearn.pipeline import Pipeline
from sklearn.metrics import classification_report, confusion_matrix

# ── 1. Data
data = json.load(open("ml/data/intents.json", encoding="utf-8"))
texts  = [ex for intent in data for ex in intent["examples"]]
labels = [intent["name"] for intent in data for _ in intent["examples"]]

# ── 2. Split: never evaluate on data the model trained on
X_train, X_test, y_train, y_test = train_test_split(
    texts, labels, test_size=0.2, stratify=labels, random_state=42
)

# ── 3. Pipeline: preprocessing + model as ONE object (no train/test leakage)
pipe = Pipeline([
    ("tfidf", TfidfVectorizer(ngram_range=(1, 2), sublinear_tf=True, min_df=1)),
    ("clf", LogisticRegression(max_iter=1000, class_weight="balanced")),
])

# ── 4. Cross-validation: a more honest estimate than one split
cv = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)
scores = cross_val_score(pipe, X_train, y_train, cv=cv, scoring="f1_macro")
print(f"CV F1: {scores.mean():.3f} ± {scores.std():.3f}")

# ── 5. Hyperparameter tuning
grid = GridSearchCV(pipe, {"clf__C": [0.1, 1, 10], "tfidf__ngram_range": [(1, 1), (1, 2)]},
                    cv=cv, scoring="f1_macro", n_jobs=-1)
grid.fit(X_train, y_train)
model = grid.best_estimator_
print("best params:", grid.best_params_)

# ── 6. Evaluate on the untouched test set
pred = model.predict(X_test)
print(classification_report(y_test, pred))      # precision, recall, F1 per class
print(confusion_matrix(y_test, pred))           # which intents get confused

# ── 7. Predict with confidence → fall back to the LLM when unsure
def classify(text: str, threshold: float = 0.6) -> str:
    probs = model.predict_proba([text])[0]
    best = int(np.argmax(probs))
    return model.classes_[best] if probs[best] >= threshold else "fallback_llm"

print(classify("what's the weather in Pune tomorrow"))

# ── 8. Save / load
joblib.dump(model, "data/intent_model.joblib")
# model = joblib.load("data/intent_model.joblib")

# Algorithms to know:
#  Regression: LinearRegression, Ridge, RandomForestRegressor, GradientBoosting (XGBoost/LightGBM)
#  Classification: LogisticRegression, SVM, RandomForest, GradientBoosting, NaiveBayes
#  Unsupervised: KMeans, DBSCAN, PCA

# PyTorch: tensors + autograd + nn.Module + the training loop
import torch
from torch import nn
from torch.utils.data import DataLoader, TensorDataset, random_split

torch.manual_seed(0)
device = "cuda" if torch.cuda.is_available() else "cpu"

# ── Tensors & autograd
x = torch.tensor([2.0, 3.0], requires_grad=True)
y = (x ** 2).sum()             # y = x0² + x1²
y.backward()                   # compute dy/dx automatically
print(x.grad)                  # tensor([4., 6.])

# ── Data: bag-of-words vectors → intent labels (toy version)
N, VOCAB, CLASSES = 2000, 300, 5
X = torch.rand(N, VOCAB)
true_w = torch.randn(VOCAB, CLASSES)
y = (X @ true_w).argmax(dim=1)
train_ds, val_ds = random_split(TensorDataset(X, y), [1600, 400])
train_dl = DataLoader(train_ds, batch_size=64, shuffle=True)
val_dl = DataLoader(val_ds, batch_size=256)

# ── Model
class IntentMLP(nn.Module):
    def __init__(self, vocab: int, hidden: int, classes: int):
        super().__init__()
        self.net = nn.Sequential(
            nn.Linear(vocab, hidden),
            nn.ReLU(),
            nn.Dropout(0.3),             # regularization: randomly zero neurons in training
            nn.Linear(hidden, classes),  # raw scores (logits); CrossEntropyLoss applies softmax
        )
    def forward(self, x):
        return self.net(x)

model = IntentMLP(VOCAB, 128, CLASSES).to(device)
loss_fn = nn.CrossEntropyLoss()
opt = torch.optim.AdamW(model.parameters(), lr=1e-3, weight_decay=1e-4)

# ── Training loop: forward → loss → backward → step
best_acc, patience = 0.0, 0
for epoch in range(50):
    model.train()
    for xb, yb in train_dl:
        xb, yb = xb.to(device), yb.to(device)
        opt.zero_grad()                 # 1. clear old gradients
        loss = loss_fn(model(xb), yb)   # 2. forward + loss
        loss.backward()                 # 3. backprop
        opt.step()                      # 4. update weights

    model.eval()
    with torch.no_grad():               # no gradients needed for evaluation
        correct = sum((model(xb.to(device)).argmax(1) == yb.to(device)).sum().item() for xb, yb in val_dl)
    acc = correct / len(val_ds)
    print(f"epoch {epoch:2d} loss {loss.item():.3f} val_acc {acc:.3f}")

    if acc > best_acc:                  # early stopping + checkpoint
        best_acc, patience = acc, 0
        torch.save(model.state_dict(), "best.pt")
    else:
        patience += 1
        if patience >= 5:
            break

# ── Inference
model.load_state_dict(torch.load("best.pt"))
model.eval()
with torch.no_grad():
    probs = torch.softmax(model(X[:1].to(device)), dim=1)

# Architectures to learn next:
#  CNN (images): nn.Conv2d → pooling → linear
#  RNN/LSTM (sequences): nn.Embedding → nn.LSTM
#  Transformer (text, everything now): attention(Q,K,V) = softmax(QKᵀ/√d)·V
#  Transfer learning: Hugging Face  AutoModelForSequenceClassification.from_pretrained("distilbert-base-uncased")

<script type="text/plain" data-code="rag">
# RAG = Retrieval-Augmented Generation:
#   INGEST:  document → chunks → embeddings → vector store
#   QUERY:   question → embedding → top-k similar chunks → LLM answers using ONLY those chunks
import numpy as np
import anthropic
from pypdf import PdfReader
from sentence_transformers import SentenceTransformer   # pip install sentence-transformers

embedder = SentenceTransformer("all-MiniLM-L6-v2")      # 384-dim, runs locally
client = anthropic.Anthropic()

# ── 1. Load & chunk (overlap keeps sentences that straddle a boundary)
def load_pdf(path: str) -> str:
    return "\n\n".join(page.extract_text() or "" for page in PdfReader(path).pages)

def chunk(text: str, size: int = 900, overlap: int = 150) -> list[str]:
    chunks, start = [], 0
    while start < len(text):
        chunks.append(text[start:start + size])
        start += size - overlap
    return [c.strip() for c in chunks if c.strip()]

# ── 2. Embed & index
class VectorStore:
    def __init__(self):
        self.chunks: list[dict] = []
        self.matrix: np.ndarray | None = None

    def add(self, source: str, texts: list[str]):
        vecs = embedder.encode(texts, normalize_embeddings=True)    # unit vectors
        self.chunks += [{"source": source, "text": t} for t in texts]
        self.matrix = vecs if self.matrix is None else np.vstack([self.matrix, vecs])

    def search(self, query: str, k: int = 4, min_score: float = 0.25) -> list[dict]:
        q = embedder.encode([query], normalize_embeddings=True)[0]
        scores = self.matrix @ q                                      # cosine similarity
        idx = np.argsort(scores)[::-1][:k]
        return [{**self.chunks[i], "score": float(scores[i])} for i in idx if scores[i] >= min_score]

store = VectorStore()
store.add("refund-policy.pdf", chunk(load_pdf("refund-policy.pdf")))

# ── 3. Generate a grounded answer with citations
def answer(question: str) -> str:
    hits = store.search(question)
    if not hits:
        return "I couldn't find that in your documents."
    context = "\n\n".join(f"[{i + 1}] ({h['source']})\n{h['text']}" for i, h in enumerate(hits))
    response = client.messages.create(
        model="claude-opus-5-5",
        max_tokens=800,
        system=("Answer ONLY from the provided context. Cite sources like [1]. "
                "If the context doesn't contain the answer, say you don't know."),
        messages=[{"role": "user", "content": f"<context>\n{context}\n</context>\n\nQuestion: {question}"}],
    )
    return "".join(b.text for b in response.content if b.type == "text")

print(answer("How many days do I have to request a refund?"))

# Make it production-grade:
#  • Store vectors in pgvector / Chroma / Pinecone instead of RAM
#  • Hybrid search: BM25 keywords + vectors, then a re-ranker
#  • Chunk by structure (headings, paragraphs), keep metadata (page, title, user_id)
#  • Filter by user_id so users only search THEIR documents
#  • Evaluate: build 30 question→expected-source pairs; measure hit rate@k and answer accuracy
</script>

# ── 1. Tools: plain functions + a JSON Schema description the model reads
TASKS: list[dict] = []

def get_time() -> str:
    return datetime.now().isoformat(timespec="minutes")

def add_task(title: str, remind_at: str | None = None) -> str:
    TASKS.append({"id": len(TASKS) + 1, "title": title, "remind_at": remind_at})
    return f"Created task #{len(TASKS)}"

def calculate(expression: str) -> str:
    import ast, operator as op
    ops = {ast.Add: op.add, ast.Sub: op.sub, ast.Mult: op.mul, ast.Div: op.truediv, ast.Pow: op.pow}
    def ev(n):                              # safe math — NEVER eval() model output
        if isinstance(n, ast.Constant): return n.value
        if isinstance(n, ast.BinOp): return ops[type(n.op)](ev(n.left), ev(n.right))
        raise ValueError("unsupported")
    return str(ev(ast.parse(expression, mode="eval").body))

REGISTRY = {"get_time": get_time, "add_task": add_task, "calculate": calculate}
TOOLS = [
    {"name": "get_time", "description": "Current local date and time.",
     "input_schema": {"type": "object", "properties": {}}},
    {"name": "add_task", "description": "Create a to-do. Use remind_at (ISO 8601) for reminders.",
     "input_schema": {"type": "object",
                      "properties": {"title": {"type": "string"}, "remind_at": {"type": "string"}},
                      "required": ["title"]}},
    {"name": "calculate", "description": "Exact arithmetic, e.g. '18 * 0.15'.",
     "input_schema": {"type": "object", "properties": {"expression": {"type": "string"}},
                      "required": ["expression"]}},
]

# ── 2. The agent loop
def run_agent(user_message: str, max_steps: int = 8) -> str:
    messages = [{"role": "user", "content": user_message}]
    for step in range(max_steps):                         # hard limit: no infinite loops
        response = client.messages.create(
            model=MODEL, max_tokens=2000, tools=TOOLS,
            system="You are JARVIS. Use tools when they help. Be brief.",
            messages=messages,
        )
        messages.append({"role": "assistant", "content": response.content})

        if response.stop_reason != "tool_use":            # model is done
            return "".join(b.text for b in response.content if b.type == "text")

        results = []
        for block in response.content:
            if block.type == "tool_use":
                print(f"  🔧 {block.name}({block.input})")
                try:
                    output = REGISTRY[block.name](**block.input)
                    results.append({"type": "tool_result", "tool_use_id": block.id, "content": output})
                except Exception as e:                    # report errors back; the model can recover
                    results.append({"type": "tool_result", "tool_use_id": block.id,
                                    "content": f"Error: {e}", "is_error": True})
        messages.append({"role": "user", "content": results})
    return "Stopped: too many steps."

print(run_agent("What's 15% tip on ₹1,840? Also remind me to pay rent tomorrow at 9am."))

# Agent design rules:
#  • Small, well-described tools with strict input schemas
#  • Validate tool inputs; check the user is allowed to do the action
#  • Confirm before irreversible actions (send money, delete, email)
#  • Log every step (tool, input, output, tokens) for debugging and evals
#  • Patterns: router → specialist agents, planner/executor, reflection, human-in-the-loop
#  • MCP (Model Context Protocol) exposes your tools to any MCP client (Claude Desktop, IDEs)
</script>

# ── 2. A quality gate in CI: block deploys that make the model worse
# tests/test_model_quality.py
def test_model_beats_baseline():
    import joblib, json
    model = joblib.load("data/intent_model.joblib")
    golden = json.load(open("tests/golden_intents.json"))      # fixed, hand-checked examples
    correct = sum(model.predict([g["text"]])[0] == g["label"] for g in golden)
    assert correct / len(golden) >= 0.90

# ── 3. LLM evals: same idea for prompts and RAG
EVAL_SET = [
    {"q": "Remind me to call mom at 6", "must_call_tool": "add_task"},
    {"q": "What is 12% of 950?", "must_contain": "114"},
]
def run_llm_evals(agent) -> float:
    passed = 0
    for case in EVAL_SET:
        out, tools_used = agent(case["q"])
        ok = ("must_call_tool" not in case or case["must_call_tool"] in tools_used) and \
             ("must_contain" not in case or case["must_contain"] in out)
        passed += ok
    return passed / len(EVAL_SET)

# ── 4. Serve with a version, log every prediction
from fastapi import FastAPI
import joblib, time, logging
app = FastAPI()
MODEL_VERSION = "intent-v7"
clf = joblib.load("data/intent_model.joblib")

@app.post("/predict")
def predict(text: str):
    t0 = time.perf_counter()
    proba = clf.predict_proba([text])[0]
    label = clf.classes_[proba.argmax()]
    logging.info("pred version=%s label=%s conf=%.2f ms=%.1f", MODEL_VERSION, label, proba.max(),
                 (time.perf_counter() - t0) * 1000)
    return {"label": label, "confidence": float(proba.max()), "model_version": MODEL_VERSION}

# boto3 = the AWS SDK for Python.  pip install boto3
# Credentials: `aws configure` locally; IAM ROLES in the cloud (never hard-code keys).
import boto3, json
from botocore.exceptions import ClientError

REGION = "ap-south-1"   # Mumbai

# ── S3: store user uploads (PDFs for RAG, images)
s3 = boto3.client("s3", region_name=REGION)
BUCKET = "jarvis-user-docs"

def upload(user_id: str, filename: str, data: bytes) -> str:
    key = f"users/{user_id}/{filename}"                  # prefix per user
    s3.put_object(Bucket=BUCKET, Key=key, Body=data, ServerSideEncryption="AES256")
    return key

def download_link(key: str) -> str:
    # Presigned URL: temporary access without making the bucket public
    return s3.generate_presigned_url("get_object", Params={"Bucket": BUCKET, "Key": key}, ExpiresIn=300)

def delete_user_files(user_id: str):
    pages = s3.get_paginator("list_objects_v2").paginate(Bucket=BUCKET, Prefix=f"users/{user_id}/")
    for page in pages:
        objs = [{"Key": o["Key"]} for o in page.get("Contents", [])]
        if objs:
            s3.delete_objects(Bucket=BUCKET, Delete={"Objects": objs})

# ── Secrets Manager: API keys and DB passwords
def get_secret(name: str) -> dict:
    sm = boto3.client("secretsmanager", region_name=REGION)
    try:
        return json.loads(sm.get_secret_value(SecretId=name)["SecretString"])
    except ClientError as e:
        raise RuntimeError(f"Secret {name} unavailable: {e.response['Error']['Code']}")

# ── SQS: queue slow jobs (document ingestion) for a background worker
sqs = boto3.client("sqs", region_name=REGION)
QUEUE_URL = "https://sqs.ap-south-1.amazonaws.com/123456789012/jarvis-ingest"
sqs.send_message(QueueUrl=QUEUE_URL, MessageBody=json.dumps({"user_id": "u1", "key": "users/u1/a.pdf"}))

# ── Bedrock: call foundation models (incl. Claude) inside your AWS account
# bedrock = boto3.client("bedrock-runtime", region_name="us-east-1")

# Where things run:
#   App Runner / ECS Fargate  → your FastAPI container (no servers to manage)
#   Lambda                    → small event-driven functions (S3 upload → ingest)
#   RDS PostgreSQL (+pgvector)→ relational data and embeddings

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/dockerfile.min.js"></script>
<script>
(function () {
  const KEY = META.key;
  let done = new Set();
  try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) {} };

  const code = {};
  document.querySelectorAll('script[data-code]').forEach(el => {
    code[el.dataset.code] = el.textContent.replace(/^\n/, "").replace(/\s+$/, "");
  });

  const route = document.getElementById("route");
  const picker = document.getElementById("picker");
  const lesson = document.getElementById("lesson");
  document.getElementById("count").textContent = L.length;

  // Build nav
  STAGES.forEach(st => {
    const items = L.filter(l => l.s === st.n);
    const div = document.createElement("div");
    div.className = "stage";
    div.innerHTML = `<div class="stage-h"><span class="stage-n">${st.n}</span><span class="stage-t">${st.title}</span></div><ul></ul>`;
    const ul = div.querySelector("ul");
    const og = document.createElement("optgroup");
    og.label = `${st.n}. ${st.title}`;
    items.forEach(l => {
      const li = document.createElement("li");
      li.innerHTML = `<button type="button" data-id="${l.id}"><span class="dot"></span><span>${l.name}</span></button>`;
      ul.appendChild(li);
      const opt = document.createElement("option");
      opt.value = l.id; opt.textContent = l.name;
      og.appendChild(opt);
    });
    route.appendChild(div);
    picker.appendChild(og);
  });
  route.addEventListener("click", e => {
    const b = e.target.closest("button[data-id]");
    if (b) go(b.dataset.id);
  });
  picker.addEventListener("change", () => go(picker.value));

  function go(id) {
    if (location.hash.slice(1) !== id) location.hash = id;
    else show(id);
  }

  function refreshProgress() {
    const n = L.filter(l => done.has(l.id)).length;
    document.getElementById("pct").textContent = `${n} / ${L.length} done`;
    document.getElementById("barfill").style.width = (n / L.length * 100) + "%";
    route.querySelectorAll("button[data-id]").forEach(b => b.parentElement.classList.toggle("done", done.has(b.dataset.id)));
  }

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  function show(id) {
    const i = Math.max(0, L.findIndex(l => l.id === id));
    const l = L[i];
    const st = STAGES[l.s - 1];
    const prev = L[i - 1], next = L[i + 1];
    const src = code[l.id] || "";
    let highlighted = esc(src);
    try {
      if (window.hljs && hljs.getLanguage(l.lang)) highlighted = hljs.highlight(src, { language: l.lang }).value;
    } catch (e) {}
    const isDone = done.has(l.id);

    lesson.innerHTML = `
      <div class="cat">Stage ${st.n} · ${st.title} · ${l.cat}</div>
      <h2>${l.name}</h2>
      <p class="what">${l.what}</p>
      <div class="grid2">
        <div class="box"><h3>Concepts to master</h3><ul>${l.concepts.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>
        <div class="box"><h3>Why it matters</h3><p>${l.why}</p></div>
      </div>
      <div class="code">
        <div class="code-bar"><span class="file">${esc(l.file)}</span><button class="copy" type="button" id="copy-btn">Copy code</button></div>
        <pre><code>${highlighted}</code></pre>
      </div>
      <div class="tip"><b>Pro tip</b><p>${l.tip}</p></div>
      ${l.jarvis ? `<div class="tip jarvis"><b>In Jarvis</b><p>${l.jarvis}</p></div>` : ""}
      <div class="actions">
        <button class="btn ${isDone ? "is-done" : "primary"}" type="button" id="done-btn">${isDone ? "✓ Learned" : "Mark as learned"}</button>
        <div class="nav-pair">
          <button class="btn" type="button" id="prev-btn" ${prev ? "" : "disabled"}>← ${prev ? esc(prev.name) : "Start"}</button>
          <button class="btn" type="button" id="next-btn" ${next ? "" : "disabled"}>${next ? esc(next.name) : "Finished"} →</button>
        </div>
      </div>`;

    document.getElementById("copy-btn").addEventListener("click", e => {
      const btn = e.currentTarget;
      const ok = () => { btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy code"), 1500); };
      const fallback = () => {
        const range = document.createRange();
        range.selectNodeContents(lesson.querySelector("pre code"));
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
        btn.textContent = "Selected — press Ctrl+C";
      };
      try { navigator.clipboard.writeText(src).then(ok, fallback); } catch (err) { fallback(); }
    });
    document.getElementById("done-btn").addEventListener("click", () => {
      done.has(l.id) ? done.delete(l.id) : done.add(l.id);
      save(); refreshProgress(); show(l.id);
    });
    if (prev) document.getElementById("prev-btn").addEventListener("click", () => go(prev.id));
    if (next) document.getElementById("next-btn").addEventListener("click", () => go(next.id));

    route.querySelectorAll("button[data-id]").forEach(b => b.setAttribute("aria-current", b.dataset.id === l.id ? "true" : "false"));
    picker.value = l.id;
    refreshProgress();
  }

  window.addEventListener("hashchange", () => { show(location.hash.slice(1)); window.scrollTo({ top: 0 }); });
  show(location.hash.slice(1) || L[0].id);
})();
</script>
