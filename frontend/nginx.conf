server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://express-api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # real client IP for rate limits & audit log
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;          # needed for streaming chat (SSE)
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri /index.html;   # single-page app routing
  }
}
