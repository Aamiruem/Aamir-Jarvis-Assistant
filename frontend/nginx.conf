server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 25m;

  # Compress text responses: the app's JavaScript and CSS shrink to about a third.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  # Camera and microphone are used by Jarvis itself (voice, Vision, Room Watch), never by embeds.
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

  location /api/ {
    proxy_pass http://express-api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # real client IP for rate limits & audit log
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;          # needed for streaming chat (SSE)
    proxy_read_timeout 300s;
  }

  # Built files have a content hash in their name, so they can be cached for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";   # always check for a new version of the app
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
  }

  location / {
    try_files $uri /index.html;   # single-page app routing
  }
}
