# Load balancer + web server for Azarvis (Docker). This file is included inside nginx's http {}.
#
# API replicas: every container of the "express-api" service (docker compose: API_REPLICAS).
# Docker's DNS (127.0.0.11) returns one address per replica; "resolve" re-reads it every 10 s,
# so replicas that are added, removed or restarted are picked up without reloading nginx.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;

upstream azarvis_api {
  zone azarvis_api 64k;
  least_conn;              # new requests go to the replica with the fewest open ones (chat streams are long)
  server express-api:4000 resolve max_fails=3 fail_timeout=10s;   # 3 failures: skip that replica for 10 s
  keepalive 64;            # reuse connections to the replicas instead of opening one per request
  keepalive_timeout 60s;   # the API keeps them 65 s (index.js), so nginx always closes first
}

# Per-visitor limits at the edge, before a request costs the API anything. The API has its own
# (shared) limits too; these stop floods early. Sign-in endpoints get a much tighter budget.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

# Behind a cloud load balancer (AWS ALB, Cloudflare...) the visitor's address is in
# X-Forwarded-For; trust it only from private networks, where such balancers sit.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 25m;

  # Compress text responses: the app's JavaScript and CSS shrink to about a third.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  # Camera and microphone are used by Jarvis itself (voice, Vision, Room Watch), never by embeds.
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

  # Shared by every /api/ location below.
  proxy_http_version 1.1;
  proxy_set_header Connection "";                                  # keep upstream connections alive
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # real client IP for rate limits & audit log
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;                       # one id from here through the API to the AI service
  proxy_connect_timeout 3s;                                        # a replica that doesn't answer fast is skipped
  # A replica that is down or restarting (connection refused / no answer): try another one.
  # Not on 502/503: those come from the API itself (e.g. "AI service unavailable") and another
  # replica would say the same. nginx never re-sends a POST a replica already received, so a
  # chat message or a change can't run twice.
  proxy_next_upstream error timeout;
  proxy_next_upstream_tries 3;
  proxy_next_upstream_timeout 10s;

  location /api/auth/ {
    limit_req zone=auth_per_ip burst=10 nodelay;
    limit_conn conn_per_ip 20;
    proxy_pass http://azarvis_api;
  }

  location /api/ {
    limit_req zone=api_per_ip burst=60 nodelay;
    limit_conn conn_per_ip 40;
    proxy_pass http://azarvis_api;
    proxy_buffering off;          # needed for streaming chat (SSE)
    proxy_read_timeout 300s;
  }

  # Probes from the load balancer / monitoring: no visitor limits, no logging noise.
  location = /api/health/ready {
    access_log off;
    proxy_pass http://azarvis_api;
  }

  # Built files have a content hash in their name, so they can be cached for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # The service worker must always be fresh, or an update could never reach installed apps.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";   # always check for a new version of the app
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
  }

  location / {
    try_files $uri /index.html;   # single-page app routing
  }
}
