<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS</title>
    <meta name="theme-color" content="#050816" />
    <script>
      // Apply the saved color theme before the page draws (see src/theme.js).
      try {
        var t = localStorage.getItem('jarvis-theme') || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta name="description" content="Jarvis: your AI assistant for tasks, reminders, documents, voice and your Windows PC." />
