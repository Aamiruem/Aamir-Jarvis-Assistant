<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Azarvis</title>
  <defs>
    <linearGradient id="az-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f4d"/>
      <stop offset="1" stop-color="#070a1a"/>
    </linearGradient>
    <linearGradient id="az-a" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="az-spark">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#az-tile)"/>
  <!-- The A, with a voice wave for its crossbar and a spark where it wakes up. -->
  <path d="M14.5 51 L32 14 L49.5 51" fill="none" stroke="url(#az-a)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M19.5 39 H24 L27 33.5 L30.5 44.5 L34 30.5 L37.5 42 L40.5 36.5 L42.5 39 H44.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="14" r="7" fill="url(#az-spark)"/>
</svg>
