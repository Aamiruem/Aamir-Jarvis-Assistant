<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Azarvis</title>
  <defs>
    <!-- Bright brand tile (cyan → indigo → magenta): stands out on dark and light backgrounds. -->
    <linearGradient id="az-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".48" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <radialGradient id="az-sheen" cx=".28" cy=".12" r=".85">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="az-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <radialGradient id="az-spark">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
    <filter id="az-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#1e1b4b" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#az-tile)"/>
  <rect width="64" height="64" rx="16" fill="url(#az-sheen)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="1.5"/>
  <!-- The A, with a voice wave for its crossbar and a spark where it wakes up. -->
  <g filter="url(#az-shadow)">
    <path d="M14.5 51 L32 14 L49.5 51" fill="none" stroke="url(#az-a)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M19.5 39 H24 L27 33.5 L30.5 44.5 L34 30.5 L37.5 42 L40.5 36.5 L42.5 39 H44.5" fill="none" stroke="#fde047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="32" cy="14" r="7" fill="url(#az-spark)"/>
</svg>
