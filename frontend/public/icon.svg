<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Azarvis</title>
  <defs>
    <!-- Bright brand tile (electric cyan → blue → violet): vivid on dark and light backgrounds. -->
    <linearGradient id="az-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset=".5" stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#b13cff"/>
    </linearGradient>
    <radialGradient id="az-sheen" cx=".3" cy=".1" r=".9">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".4"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="az-core" cx=".5" cy=".62" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="az-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3f4ff"/>
    </linearGradient>
    <radialGradient id="az-spark">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".3" stop-color="#fff59d"/>
      <stop offset="1" stop-color="#ffd600" stop-opacity="0"/>
    </radialGradient>
    <filter id="az-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.3" flood-color="#160f4d" flood-opacity=".65"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#az-tile)"/>
  <rect width="64" height="64" rx="16" fill="url(#az-sheen)"/>
  <rect width="64" height="64" rx="16" fill="url(#az-core)"/>
  <!-- The assistant's core: a ring behind the letter. -->
  <circle cx="32" cy="35" r="21" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="1.6" stroke-dasharray="2.6 3.4"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="2"/>
  <!-- A bold A, a voice wave for its crossbar, and a spark where it wakes up. -->
  <g filter="url(#az-shadow)">
    <path d="M13.5 52 L32 14 L50.5 52" fill="none" stroke="url(#az-a)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M19.5 39.5 H24.5 L27.5 34 L31 45 L34.5 31 L38 42.5 L41 37 L43 39.5 H44.5" fill="none" stroke="#ffe03d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="32" cy="14" r="8.5" fill="url(#az-spark)"/>
</svg>
